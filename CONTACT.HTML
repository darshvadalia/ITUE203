<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Hub - Contact</title>
  </head>

  <body style="background-color: #f4f1ea; font-family: Arial, sans-serif;">
    <center>
      <img src="https://admission.charusat.ac.in/View%20Assets/MainPage/assets/charusat%20images/logo.png" alt="CHARUSAT logo" style="width: 140px; max-width: 80%; height: auto;" />
      <h1>CONTACT US</h1>

      <p>Have a question? Send us a message and we will help you.</p>

      <form>
        <label for="name">Full Name:</label>
        <input id="name" type="text" required />
        <br /><br />

        <label for="email">Email:</label>
        <input id="email" type="email" required />
        <br /><br />

        <label for="message">Message:</label>
        <br />
        <textarea id="message" rows="5" cols="30" required></textarea>
        <br /><br />

        <input type="submit" value="Send Message" />
        <input type="reset" value="Clear" />
      </form>

      <p>
        Email: studenthub@charusat.edu.in<br />
        Phone: +91 2697 265011
      </p>

      <p>
        <a href="DASHBOARD.HTML"><button>Dashboard</button></a>
      </p>

      <nav style="margin-top: 20px;">
        <a href="../HOME.HTML"><button>Back to Home</button></a>
      </nav>
    </center>
  </body>
</html>
